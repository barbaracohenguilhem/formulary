    <div id="root"></div>
    <script>
      // A phone or a simulator has no inspector: a boot failure is painted on the screen instead.
      (function () {
        function show(head, body) {
          // only a boot that never painted: once the app is up, a stray rejection must not cover it
          var root = document.getElementById('root');
          if (root && root.childElementCount > 0) return;
          var pre = document.createElement('pre');
          pre.style.cssText =
            'position:fixed;inset:0;margin:0;padding:24px;background:#14120f;color:#f2efe7;font:12px/1.5 monospace;white-space:pre-wrap;overflow:auto;z-index:99';
          pre.textContent = head + '\n\n' + body;
          document.body.appendChild(pre);
        }
        window.addEventListener('error', function (e) {
          show('boot failed', (e.message || e) + '\n' + (e.filename || '') + ':' + (e.lineno || '') + '\n\n' + (e.error && e.error.stack ? e.error.stack : ''));
        });
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason;
          show('unhandled rejection', r && (r.stack || r.message) ? r.stack || r.message : String(r));
        });
        window.__moduleFailed = function () {
          show('module failed to load', 'the browser could not fetch or parse /src/main.tsx or one of its imports (see the network log)');
        };
      })();
    </script>
